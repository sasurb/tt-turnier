name: Veröffentlichen

# Bei jedem Push auf main: testen, dann
#  1. Server-Paket per SFTP auf den Webspace (Strato) laden – nur wenn die Secrets eingetragen sind
#  2. Demo (nur Einzelgerät-Modus) auf GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: veroeffentlichen
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  webspace:
    name: Webspace (SFTP)
    needs: tests
    runs-on: ubuntu-latest
    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_USER: ${{ secrets.SFTP_USER }}
      LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORT }}
      SFTP_ZIEL: ${{ secrets.SFTP_ZIEL }}           # Server-Code + config.php, außerhalb jedes Webroots
      SFTP_ZIEL_WEB: ${{ secrets.SFTP_ZIEL_WEB }}   # optional: öffentlicher Ordner der App; leer = ${SFTP_ZIEL}/public
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORT: ${{ secrets.DB_PASSWORT }}
      SETUP_CODE: ${{ secrets.SETUP_CODE }}
      ADMIN_MAIL: ${{ secrets.ADMIN_MAIL }}          # Info-Mails (neue Konten, Rückmeldungen); Antworten auf System-Mails
      MAIL_ABSENDER: ${{ vars.BETREIBER_MAIL }}      # Postfach der eigenen Domain, z. B. tt-turnier@saschaurban.de
      APP_URL: ${{ vars.WEBSPACE_URL }}              # Adresse der App, z. B. https://saschaurban.de/tt-turnier
      VITE_BETREIBER_NAME: ${{ vars.BETREIBER_NAME }}
      VITE_BETREIBER_ANSCHRIFT: ${{ vars.BETREIBER_ANSCHRIFT }}
      VITE_BETREIBER_MAIL: ${{ vars.BETREIBER_MAIL }}
      VITE_BETREIBER_TELEFON: ${{ vars.BETREIBER_TELEFON }}
    steps:
      - name: Secrets prüfen
        id: pruefen
        run: |
          fehlt=""
          # Paare „Secret-Name:Umgebungsvariable“ – gemeldet wird der Name, den man bei GitHub einträgt
          for paar in SFTP_HOST:SFTP_HOST SFTP_USER:SFTP_USER SFTP_PASSWORT:LFTP_PASSWORD SFTP_ZIEL:SFTP_ZIEL \
                      DB_HOST:DB_HOST DB_NAME:DB_NAME DB_USER:DB_USER DB_PASSWORT:DB_PASSWORT SETUP_CODE:SETUP_CODE; do
            var="${paar#*:}"
            [ -z "${!var}" ] && fehlt="$fehlt ${paar%%:*}"
          done
          if [ -n "$fehlt" ]; then
            echo "::notice::Webspace-Deploy übersprungen, es fehlen Secrets:$fehlt (siehe docs/strato-einrichtung.md)"
            echo "weiter=nein" >> "$GITHUB_OUTPUT"
          else
            echo "weiter=ja" >> "$GITHUB_OUTPUT"
          fi
          # Mailversand (Registrierung, Passwort vergessen, Sicherungen) ist optional
          for paar in "Variable BETREIBER_MAIL:MAIL_ABSENDER" "Variable WEBSPACE_URL:APP_URL" "Secret ADMIN_MAIL:ADMIN_MAIL"; do
            var="${paar#*:}"
            [ -z "${!var}" ] && echo "::warning::${paar%%:*} fehlt – Mails (Passwort vergessen, Sicherungen, Info an den Betreiber) sind ausgeschaltet."
          done
          [ -z "$VITE_BETREIBER_NAME" ] && echo "::warning::Variable BETREIBER_NAME fehlt – Impressum und Datenschutzhinweis sind unvollständig."
          true
      - uses: actions/checkout@v7
        if: steps.pruefen.outputs.weiter == 'ja'
      - uses: actions/setup-node@v7
        if: steps.pruefen.outputs.weiter == 'ja'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: App bauen
        if: steps.pruefen.outputs.weiter == 'ja'
        working-directory: app
        run: npm ci && npm run build
      - name: Paket und config.php erzeugen
        if: steps.pruefen.outputs.weiter == 'ja'
        run: |
          ./scripts/paket-bauen.sh paket
          php -r '
            $c = [
              "db" => [
                "dsn" => "mysql:host=" . getenv("DB_HOST") . ";dbname=" . getenv("DB_NAME") . ";charset=utf8mb4",
                "user" => getenv("DB_USER"),
                "pass" => getenv("DB_PASSWORT"),
              ],
              "setup_code" => getenv("SETUP_CODE"),
              "app_url" => getenv("APP_URL") ?: "",
              "mail" => [
                "absender" => getenv("MAIL_ABSENDER") ?: "",
                "admin" => getenv("ADMIN_MAIL") ?: "",
              ],
            ];
            file_put_contents("paket/config.php", "<?php\nreturn " . var_export($c, true) . ";\n");
          '
          WEB="${SFTP_ZIEL_WEB:-${SFTP_ZIEL}/public}"
          # Weg vom öffentlichen api-Ordner zum Server-Ordner (beide relativ zum SFTP-Startverzeichnis)
          REL=$(python3 -c 'import os,sys; print(os.path.relpath(sys.argv[2], sys.argv[1]))' "$WEB/api" "$SFTP_ZIEL")
          printf "<?php\nreturn __DIR__ . '/%s';\n" "$REL" > paket/public/api/server.php
          echo "Öffentlich: $WEB  ·  Server: $SFTP_ZIEL  ·  Weg aus api/: $REL"
          echo "WEB=$WEB" >> "$GITHUB_ENV"
      - name: Hochladen per SFTP
        if: steps.pruefen.outputs.weiter == 'ja'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          verbinden() {
            lftp --env-password "sftp://${SFTP_USER}@${SFTP_HOST}" \
              -e "set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; $1 bye"
          }
          # Schutz: Der öffentliche Ordner wird abgeglichen (fremde Dateien darin würden gelöscht).
          # Deshalb nur hochladen, wenn er leer ist oder erkennbar dieser App gehört.
          INHALT=$(verbinden "cls -1a ${WEB}/;" 2>/dev/null | sed 's#/$##; s#.*/##' | grep -vE '^\.{1,2}$' || true)
          hat() { echo "$INHALT" | grep -qxE "$1"; }
          if [ -n "$INHALT" ] && ! hat '\.tt-turnier-app' \
             && ! { hat 'index\.html' && hat 'api'; } \
             && ! { hat 'public' && hat 'src' && hat 'config\.php'; }; then
            echo "::error::Der Ordner ${WEB} enthält fremde Dateien – zum Schutz wird nichts hochgeladen."
            echo "$INHALT"
            exit 1
          fi
          verbinden "
            mkdir -p -f ${SFTP_ZIEL};
            mkdir -p -f ${WEB};
            mirror --reverse --delete --verbose=1 paket/src ${SFTP_ZIEL}/src;
            put paket/config.php -o ${SFTP_ZIEL}/config.php;
            mirror --reverse --delete --verbose=1 paket/public ${WEB};"
      - name: Erreichbarkeit prüfen
        if: steps.pruefen.outputs.weiter == 'ja' && vars.WEBSPACE_URL != ''
        run: curl -sf "${{ vars.WEBSPACE_URL }}/api/index.php?r=info" && echo

  pages:
    name: Demo auf GitHub Pages
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        env:
          VITE_BETREIBER_NAME: ${{ vars.BETREIBER_NAME }}
          VITE_BETREIBER_ANSCHRIFT: ${{ vars.BETREIBER_ANSCHRIFT }}
          VITE_BETREIBER_MAIL: ${{ vars.BETREIBER_MAIL }}
          VITE_BETREIBER_TELEFON: ${{ vars.BETREIBER_TELEFON }}
          VITE_KONTAKT_URL: ${{ vars.WEBSPACE_URL }}
        run: npm ci && npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist
      - id: deploy
        uses: actions/deploy-pages@v5
